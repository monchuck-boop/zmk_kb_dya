name: Build ZMK firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Python環境を設定
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. westツールをインストール
      - name: Install West
        run: |
          pip install --upgrade pip
          pip install west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 3. ZMK/Zephyrに必要なコンパイルツール（Armクロスコンパイラ）をインストール
      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi bsdmainutils ninja-build

      # 4. Zephyrにツールチェーンの場所を環境変数で指示
      - name: Set Toolchain Environment Variables
        run: |
          echo "ZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb" >> $GITHUB_ENV
          echo "GNUARMEMB_TOOLCHAIN_PATH=/usr" >> $GITHUB_ENV

      # 5. リポジトリ内の設定をもとに環境を初期化
      - name: West Init
        run: |
          west init -l config --mf west-standalone.yml
          west update
          west zephyr-export

      # 6. 【最重要：エラー解決】west build直前のPython環境に対して、直接pyelftoolsと要求ファイルを強制インストール
      - name: Target Python Environment Fix
        run: |
          /opt/hostedtoolcache/Python/3.11.17/x64/bin/python -m pip install --upgrade pip
          /opt/hostedtoolcache/Python/3.11.17/x64/bin/python -m pip install pyelftools
          if [ -f dependencies/zephyr/scripts/requirements.txt ]; then
            /opt/hostedtoolcache/Python/3.11.17/x64/bin/python -m pip install -r dependencies/zephyr/scripts/requirements.txt
          fi

      # 7. 右手専用を指定してコンパイル
      - name: Build Right Hand Only (Central)
        run: |
          cd dependencies/zmk/app
          west build -b nice_nano -- -DSHIELD=keyball61_right -DZMK_CONFIG="${{ github.workspace }}/config"

      # 8. 完成した右手単体用の zmk.uf2 を成果物として保存
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-right-firmware
          path: dependencies/zmk/app/build/zephyr/zmk.uf2
