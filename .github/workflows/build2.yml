name: Build ZMK firmware2

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - '.github/workflows/build2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install West, Elftools, Protobuf & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install west pyelftools protobuf grpcio-tools
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools
          /usr/bin/python3 -m pip install --break-system-packages west pyelftools protobuf grpcio-tools || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install ARM Toolchain
        run: |
          sudo apt-get install -y gcc-arm-none-eabi bsdmainutils ninja-build device-tree-compiler protobuf-compiler

      - name: Set Toolchain and Python Environment Variables
        run: |
          echo "ZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb" >> $GITHUB_ENV
          echo "GNUARMEMB_TOOLCHAIN_PATH=/usr" >> $GITHUB_ENV
          echo "WEST_PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          echo "PYTHON_EXECUTABLE=/usr/bin/python3" >> $GITHUB_ENV

      - name: West Init
        run: |
          west init -l config --mf west-standalone.yml
          west update
          west zephyr-export

      - name: Patch Zephyr and Modules for GCC 14 Compatibility
        run: |
          # 1) settings-rpc モジュールの snprintf 不足の修正 (stdio.h を追加)
          FILE_RPC="dependencies/zmk-module-settings-rpc/src/studio/settings_rpc_handler.c"
          if [ -f "$FILE_RPC" ]; then
            sed -i '1s/^/#include <stdio.h>\n/' "$FILE_RPC"
            echo "Patched $FILE_RPC"
          fi

          # 2) 🔥【正規表現強化】runtime-input-processor モジュールの const 型不整合を確実に置換
          # スペースや改行の数に左右されず、"static struct device *runtime_processors" を強制的に const 化します
          FILE_INPUT="dependencies/zmk-module-runtime-input-processor/src/pointing/input_processor_runtime.c"
          if [ -f "$FILE_INPUT" ]; then
            perl -i -pe 's/static\s+struct\s+device\s*\*\s*runtime_processors/static const struct device *runtime_processors/g' "$FILE_INPUT"
            echo "Successfully patched const qualifier via regex in $FILE_INPUT"
          fi

          # 3) 全ビルド、全モジュールから警告によるビルド停止の影響を抑え込む予備措置
          ZMK_CMAKE="dependencies/zmk/app/CMakeLists.txt"
          if [ -f "$ZMK_CMAKE" ]; then
            sed -i '2i add_compile_options("-Wno-error")' "$ZMK_CMAKE"
            echo "Successfully injected -Wno-error into $ZMK_CMAKE"
          fi

      - name: Build Right Hand Only (Central)
        run: |
          cd dependencies/zmk/app
          west build -b nice_nano -- -DSHIELD=keyball61_right -DZMK_CONFIG="${{ github.workspace }}/config"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-right-firmware
          path: dependencies/zmk/app/build/zephyr/zmk.uf2
