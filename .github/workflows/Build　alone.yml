name: Build ZMK firmware alone

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # エラー原因：westコマンドを事前にシステムへインストールするステップを追加
      - name: Install West
        run: pip install west

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildcache
            dependencies
          key: ${{ runner.os }}-zmk-${{ hashFiles('Makefile', 'west-standalone.yml') }}

      - name: Initialize standalone environment
        run: make init-standalone

      - name: Build Right Hand Only (Central)
        run: |
          cd dependencies/zmk/app
          west build -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG="${{ github.workspace }}/config"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-right-firmware
          path: dependencies/zmk/app/build/zephyr/zmk.uf2
