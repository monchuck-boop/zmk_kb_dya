name: Build ZMK firmware al

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Python環境を立ち上げる
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. westツールをインストールし、LinuxのPATH（実行環境）に強制的に追加する
      - name: Install West & Add to PATH
        run: |
          pip install west
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 3. リポジトリ内の設定をもとに環境を初期化（これでwest initエラーも回避できます）
      - name: West Init
        run: |
          west init -l config --mf west-standalone.yml
          west update
          west zephyr-export

      # 4. 右手専用（keyball61_right）を指定してコンパイル
      - name: Build Right Hand Only (Central)
        run: |
          cd dependencies/zmk/app
          west build -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG="${{ github.workspace }}/config"

      # 5. 完成した右手単体用の zmk.uf2 を成果物として保存
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61-right-firmware
          path: dependencies/zmk/app/build/zephyr/zmk.uf2
