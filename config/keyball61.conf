# ---------------------------------------------------------------------------
# 省電力・電波出力・基本システム設定
# ---------------------------------------------------------------------------
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# 送信電波出力を最大（+8dBm）に設定
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_NEWLIB_LIBC=y
CONFIG_PICOLIBC_IO_LONG_LONG=y

# ---------------------------------------------------------------------------
# 【最重要】ZMK Studio プレビュー結合エラーを完全に回避する設定
# ---------------------------------------------------------------------------
CONFIG_ZMK_PHYSICAL_LAYOUTS=n
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=n
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=n

# ---------------------------------------------------------------------------
# 不要なスプリット用拡張モジュールをビルドから除外
# ---------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=n
